name: phase1-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce repository data hygiene
        shell: bash
        run: |
          set -euo pipefail
          forbidden_ext='\.(csv|tsv|zip|jsonl|parquet|xlsx)$'
          forbidden_dir='^(data|raw|outputs|artifacts|private)/'

          current_paths="$(git ls-files)"
          if printf '%s\n' "$current_paths" | grep -E "$forbidden_ext" ; then
            echo 'Forbidden real-data/archive extension is tracked in the current tree.' >&2
            exit 1
          fi
          if printf '%s\n' "$current_paths" | grep -E "$forbidden_dir" ; then
            echo 'Forbidden data directory is tracked in the current tree.' >&2
            exit 1
          fi

          history_paths="$(git rev-list --objects --all | cut -d' ' -f2- | sed '/^$/d')"
          if printf '%s\n' "$history_paths" | grep -E "$forbidden_ext" ; then
            echo 'Forbidden real-data/archive extension exists in Git history.' >&2
            exit 1
          fi
          if printf '%s\n' "$history_paths" | grep -E "$forbidden_dir" ; then
            echo 'Forbidden data directory exists in Git history.' >&2
            exit 1
          fi

          echo 'Current-tree and full-history data hygiene checks passed.'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q

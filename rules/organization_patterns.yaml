schema_version: 1
rules:
  - rule_id: lens.infrastructure.aws.asn_org
    target: infrastructure
    field: asn_organization
    operator: regex
    pattern: '(?:amazon\.com|amazon data services|amazon technologies|\baws\b)'
    resolved_category: cloud_vendor
    organization: Amazon Web Services
    source: LENS-20260602
    notes: CLOUD_PAT/CLOUD_ISP_SKIP migration; infrastructure context, never hosted organization identity.
  - rule_id: lens.infrastructure.cernet.asn_org
    target: infrastructure
    field: asn_organization
    operator: regex
    pattern: '(?:cernet|china education and research network)'
    resolved_category: education_research
    organization: CERNET
    source: LENS-20260602
    notes: Network context only unless a separate authority explicitly identifies an institution.
  - rule_id: lens.infrastructure.cloud.asn_org
    target: infrastructure
    field: asn_organization
    operator: regex
    pattern: '(?:alibaba|aliyun|tencent|huawei cloud|google llc|microsoft|cloudflare|hetzner|digitalocean|ovh|oracle corporation|linode|vultr)'
    resolved_category: cloud_vendor
    organization: Generic cloud/CDN provider
    source: LENS-20260602
    notes: Broad LENS cloud pattern retained as infrastructure classification, not identity attribution.
  - rule_id: lens.infrastructure.isp.asn_org
    target: infrastructure
    field: asn_organization
    operator: regex
    pattern: '(?:chinanet|china telecom|china unicom|china mobile|comcast|verizon|deutsche telekom|\bntt\b|\bkddi\b)'
    resolved_category: isp_carrier
    organization: Generic ISP/carrier
    source: LENS-20260602
    notes: Broad LENS ISP pattern retained as network context, not hosted organization identity.


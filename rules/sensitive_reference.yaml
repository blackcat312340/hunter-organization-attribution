  - reference_id: lens.sensitive.state_owned_critical
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: state_owned_critical
    display_name: 国有关键基础设施
    pattern: 'state grid|国家电网|petrochina|中石油|sinopec|中石化|china national nuclear|中核|航天科技|航天科工|csg\.|power grid|nuclear regulatory'

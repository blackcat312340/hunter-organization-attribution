runtime_status: reference_only
reason: >-
  LENS detect_sensitive is a separate sensitive-asset classifier, not the general
  organization-category classifier. Its semantics combine org/domain/hosts/titles
  and then apply CLOUD_ISP_SKIP and STRONG_GOV_SIGNAL as a cross-field guard.
  Phase 1 preserves these rules verbatim for provenance but does not silently
  reinterpret them as independent organization-attribution category rules.
rules:
  - reference_id: lens.sensitive.us_executive
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: us_executive
    display_name: 美国行政机构（白宫等）
    pattern: 'white\s*house|whitehouse\.gov|executive office of the president'
    executable: false
  - reference_id: lens.sensitive.defense_military
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: defense_military
    display_name: 国防/军事
    pattern: 'department of defense|\bdod\b|defense\.gov|pentagon|armed forces|joint chiefs|national guard|bundeswehr|ministry of defence|ministry of defense|国防部|中央军委|军事科学院|军事|national defense|army\.mil|navy\.mil|af\.mil|marines\.mil|lockheed martin|raytheon|northrop grumman|bae systems'
    executable: false
  - reference_id: lens.sensitive.intelligence
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: intelligence
    display_name: 情报/安全机构
    pattern: '\bnsa\b|\bcia\b|\bfbi\b|\bdhs\b|homeland security|secret service|gchq|\bmi5\b|\bmi6\b|direction générale|dgse|bnd\b|情报局|国家安全部|国安部|national security agency'
    executable: false
  - reference_id: lens.sensitive.government

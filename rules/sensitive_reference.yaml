    pattern: '\.gov\.|\.gov\b|\.mil\b|department of state|state department|state\.gov|ministry of|government of|gov\.uk|gouv\.fr|parliament|congress\.gov|senate\.gov|house\.gov|国务院|人民政府|政务|公安部|工信部|科技部|europa\.eu|european commission|administrative office|federal agency'
    executable: false
  - reference_id: lens.sensitive.embassy_diplomatic
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: embassy_diplomatic
    display_name: 外交/使馆
    pattern: 'embassy|consulate|diplomatic|外交|大使馆|领事馆'
    executable: false
  - reference_id: lens.sensitive.central_bank_finance
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: central_bank_finance
    display_name: 央行/金融监管
    pattern: 'federal reserve|central bank|人民银行|pboc|securities and exchange|sec\.gov|financial conduct authority|ecb\.|european central bank'
    executable: false
  - reference_id: lens.sensitive.law_enforcement
    kind: sensitive_rule
    source_symbol: SENSITIVE_RULES
    label: law_enforcement
    display_name: 执法/边境
    pattern: 'border protection|customs and border|\bcbp\b|immigration|ice\.gov|law enforcement|police department|公安|警务'
